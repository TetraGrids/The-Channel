name: Mainnet todo sync

on:
  push:
    paths:
      - "TO-DO-B4-MAINNET.md"
      - ".github/scripts/sync_mainnet_todo.py"
      - ".github/workflows/mainnet-todo-sync.yml"
  issues:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: mainnet-todo-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'TetraGrids/The-Channel'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create issues for new rows
        if: github.event_name != 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/sync_mainnet_todo.py create
          if git diff --quiet -- TO-DO-B4-MAINNET.md; then
            echo "no new issues"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add TO-DO-B4-MAINNET.md
            git commit -m "Link GitHub issues for new mainnet todos."
            git push
          fi

      - name: Drop closed issue from the table
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOSED_ISSUE: ${{ github.event.issue.number }}
        run: |
          python3 .github/scripts/sync_mainnet_todo.py close "${CLOSED_ISSUE}"
          if git diff --quiet -- TO-DO-B4-MAINNET.md; then
            echo "table unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add TO-DO-B4-MAINNET.md
            git commit -m "Remove closed mainnet todo #${CLOSED_ISSUE}."
            git push
          fi
