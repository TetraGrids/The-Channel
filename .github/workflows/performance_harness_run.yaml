name: "Performance Harness Run"

on:
  workflow_dispatch:
    inputs:
      platform-choice:
        description: 'Select Platform'
        type: choice
        options:
        - ubuntu22
      override-test-params:
        description: 'Override perf harness params'
        type: string
      override-channel:
        description: Override channel target
        type: string
      override-channel-prerelease:
        type: choice
        description: Override channel prelease
        options:
        - default
        - true
        - false

permissions:
  packages: read
  contents: read

defaults:
  run:
    shell: bash

jobs:

  v:
    name: Discover Inputs
    runs-on: ubuntu-latest
    outputs:
      test-params: ${{steps.overrides.outputs.test-params}}
      channel-target: ${{steps.overrides.outputs.channel-target}}
      channel-prerelease: ${{steps.overrides.outputs.channel-prerelease}}
    steps:
      - name: Setup Input Params
        id: overrides
        run: |
          echo test-params=findMax testBpOpMode >> $GITHUB_OUTPUT
          echo channel-target="DEFAULT" >> $GITHUB_OUTPUT
          echo channel-prerelease="false" >> $GITHUB_OUTPUT

          if [[ "${{inputs.override-test-params}}" != "" ]]; then
            echo test-params=${{inputs.override-test-params}} >> $GITHUB_OUTPUT
          fi
          if [[ "${{inputs.override-channel}}" != "" ]]; then
            echo channel-target=${{inputs.override-channel}} >> $GITHUB_OUTPUT
          fi
          if [[ "${{inputs.override-channel-prerelease}}" == +(true|false) ]]; then
            echo channel-prerelease=${{inputs.override-channel-prerelease}} >> $GITHUB_OUTPUT
          fi

  platform-cache:
    name: Platform Cache
    uses: AntelopeIO/platform-cache-workflow/.github/workflows/platformcache.yaml@v1
    permissions:
      packages: write
      contents: read
    with:
      runs-on: '["self-hosted", "enf-x86-beefy"]'
      platform-files: .cicd/platforms

  reuse-build:
    name: Reuse channel build
    needs: [v]
    runs-on: ubuntu-latest
    outputs:
      build-artifact: ${{steps.downloadBuild.outputs.downloaded-file}}
    steps:
        - name: Download builddir
          id: downloadBuild
          uses: AntelopeIO/asset-artifact-download-action@v3
          with:
            owner: AntelopeIO
            repo: channel
            file: build.tar.zst
            target: ${{github.sha}}
            artifact-name: ${{github.event.inputs.platform-choice}}-build
            fail-on-missing-target: false
        - name: Upload builddir
          if: steps.downloadBuild.outputs.downloaded-file != ''
          uses: actions/upload-artifact@v4
          with:
            name: ${{github.event.inputs.platform-choice}}-build
            path: build.tar.zst
            compression-level: 0

  build-base:
    name: Run Build Workflow
    needs: [platform-cache, reuse-build]
    if: needs.reuse-build.outputs.build-artifact == ''
    uses: ./.github/workflows/build_base.yaml
    with:
      platforms: ${{needs.platform-cache.outputs.platforms}}
      platform-list: '["${{github.event.inputs.platform-choice}}"]'

  tests:
    name: Tests
    needs: [v, platform-cache, reuse-build, build-base]
    if: always() && (needs.build-base.result == 'success' || needs.reuse-build.result == 'success')
    runs-on: ["Leap-Perf-Ubuntu-22-16x64x600"]
    container:
      image: ${{fromJSON(needs.platform-cache.outputs.platforms)[github.event.inputs.platform-choice].image}}
    steps:
      - name: Download builddir
        uses: actions/download-artifact@v4
        with:
          name: ${{github.event.inputs.platform-choice}}-build
      - name: Extract Build Directory
        run: |
          zstdcat build.tar.zst | tar x
      - if: ${{ needs.v.outputs.channel-target != 'DEFAULT' }}
        name: Download Prev The Channel Version
        uses: AntelopeIO/asset-artifact-download-action@v3
        with:
          owner: AntelopeIO
          repo: channel
          target: '${{needs.v.outputs.channel-target}}'
          prereleases: ${{fromJSON(needs.v.outputs.channel-prerelease)}}
          file: 'channel.*${{github.event.inputs.platform-choice}}.*(x86_64|amd64).deb'
      - if: ${{ needs.v.outputs.channel-target != 'DEFAULT' }}
        name: Install channel & replace binaries for PH use
        run: |
          apt-get update
          apt-get install -y ./channel*.deb
          rm build/bin/channeld
          rm build/bin/chan
          cp /usr/bin/channeld build/bin
          cp /usr/bin/chan build/bin
          ./build/bin/channeld --full-version
          ./build/bin/chan version full
      - name: Run Performance Test
        run: |
          cd build
          ./tests/PerformanceHarnessScenarioRunner.py ${{needs.v.outputs.test-params}}
      - name: Prepare results
        id: prep-results
        run: |
          tar -pc build/PHSRLogs | zstd --long -T0 -9 > PHSRLogs.tar.zst
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: performance-test-results
          path: PHSRLogs.tar.zst
          compression-level: 0
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: performance-test-report
          path: ./build/PHSRLogs/**/report.json
